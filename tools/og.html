<!doctype html>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Pixelify Sans"; src: url(../public/fonts/PixelifySans.woff2) format("woff2"); font-weight: 400 700; }

  p { font-size: 30px; line-height: 1.15; max-width: 640px; }
